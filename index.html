<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Crosshair Death Roulette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#080c14',
                        cardBg: '#101726',
                        cardBorder: '#1e293b',
                        accent: '#ff5722',
                        accentHover: '#f4511e'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans selection:bg-accent selection:text-white">

    <!-- Header -->
    <header class="border-b border-cardBorder bg-darkBg/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent to-amber-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-accent/20">
                    CS
                </div>
                <div>
                    <h1 class="font-black tracking-wider text-white text-lg uppercase">Crosshair Roulette</h1>
                    <p class="text-xs text-slate-400">Cycle through the list</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-cardBg border border-cardBorder px-3 py-1.5 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="counter-indicator" class="text-xs font-medium text-slate-300">1 / 6</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-xl w-full mx-auto px-6 py-12 flex flex-col items-center justify-center">
        
        <!-- Roulette Machine Box -->
        <div class="w-full bg-cardBg border border-cardBorder rounded-3xl p-8 shadow-2xl relative overflow-hidden text-center">
            
            <!-- Glow background effect -->
            <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-64 h-64 bg-accent/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="mb-6">
                <span id="crosshair-tag" class="text-[10px] font-bold uppercase tracking-widest text-cyan-400 bg-cyan-950/60 border border-cyan-800/50 px-3 py-1 rounded-md">Precision</span>
                <h2 id="crosshair-name" class="text-3xl font-black text-white mt-3">Clean Cyan Dot</h2>
                <p id="crosshair-desc" class="text-slate-400 text-sm mt-2">Crisp cyan center dot built for sharp accuracy and tiny target identification at long range.</p>
            </div>

            <!-- Hidden Code Box -->
            <div class="bg-slate-950/80 border border-cardBorder rounded-xl p-4 mb-6 flex items-center justify-between text-xs text-slate-500 font-mono">
                <span class="tracking-widest text-slate-600 truncate pr-2">••••••••••••••••••••••••••••••••</span>
                <span class="text-emerald-400 shrink-0 font-sans text-xs font-semibold bg-emerald-950/50 border border-emerald-800/40 px-2.5 py-1 rounded">Hidden</span>
            </div>

            <!-- Buttons -->
            <div class="space-y-3">
                <button id="spin-btn" onclick="nextCrosshair()" 
                    class="w-full bg-slate-800 hover:bg-slate-700 text-white font-extrabold py-4 px-6 rounded-2xl text-base transition-all border border-slate-700 shadow-lg active:scale-[0.98] flex items-center justify-center space-x-2 cursor-pointer">
                    <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                    <span>Next Crosshair</span>
                </button>

                <button id="copy-btn" onclick="copyCurrentCommand()" 
                    class="w-full bg-accent hover:bg-accentHover text-white font-bold py-4 px-6 rounded-2xl text-base transition-all shadow-lg shadow-accent/25 active:scale-[0.98] flex items-center justify-center space-x-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    <span>Copy Command</span>
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-cardBorder py-6 text-center text-xs text-slate-500">
        <p>CS2 Crosshair Roulette • Sequential Vault</p>
    </footer>

    <!-- Floating Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl font-bold text-sm transform translate-y-24 opacity-0 transition-all duration-300 flex items-center space-x-3 z-50 border border-emerald-500/40">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
        <span>Command Copied to Clipboard!</span>
    </div>

    <!-- Script -->
    <script>
        const crosshairs = [
            {
                name: "The Reckoning",
                tag: "Precision",
                tagColor: "text-cyan-400 bg-cyan-950/60 border-cyan-800/50",
                desc: "Crisp cyan center dot built for sharp accuracy and tiny target identification at long range.",
                command: `cl_crosshair_drawoutline "1"; cl_crosshair_dynamic_maxdist_splitratio "1"; cl_crosshair_dynamic_splitalpha_innermod "0"; cl_crosshair_dynamic_splitalpha_outermod "1"; cl_crosshair_dynamic_spread_limit "255"; cl_crosshair_dynamic_splitdist "3"; cl_crosshair_t "0"; cl_crosshairalpha "255"; cl_crosshaircolor_b "0"; cl_crosshaircolor_g "17"; cl_crosshaircolor_r "255"; cl_crosshairdot "1"; cl_crosshair_gap "128"; cl_crosshairsize "255"; cl_crosshairstyle "3"; cl_crosshairthickness "31"; cl_crosshair_recoil "0"; cl_crosshairoutline_r "0"; cl_crosshairoutline_g "0"; cl_crosshairoutline_b "0"; cl_crosshairoutline_a "255"; cl_ironsight_dot_scale "1"; cl_ironsight_usecrosshaircolor "0"`
            },
            {
                name: "Classic Clown",
                tag: "Goofy",
                tagColor: "text-emerald-400 bg-emerald-950/60 border-emerald-800/50",
                desc: "Traditional style 4 green crosshair balanced ideally for smooth spray control and general rifles.",
                command: `cl_crosshair_drawoutline "1"; cl_crosshair_dynamic_maxdist_splitratio "1"; cl_crosshair_dynamic_splitalpha_innermod "0"; cl_crosshair_dynamic_splitalpha_outermod "1"; cl_crosshair_dynamic_spread_limit "3"; cl_crosshair_dynamic_splitdist "0"; cl_crosshair_t "1"; cl_crosshairalpha "255"; cl_crosshaircolor_b "0"; cl_crosshaircolor_g "0"; cl_crosshaircolor_r "255"; cl_crosshairdot "1"; cl_crosshair_gap "4"; cl_crosshairsize "12"; cl_crosshairstyle "7"; cl_crosshairthickness "2"; cl_crosshair_recoil "0"; cl_crosshairoutline_r "0"; cl_crosshairoutline_g "0"; cl_crosshairoutline_b "0"; cl_crosshairoutline_a "255"; cl_ironsight_dot_scale "1"; cl_ironsight_usecrosshaircolor "0"`
            },
            {
                name: "Estrogen en Español",
                tag: "Vibrant",
                tagColor: "text-amber-400 bg-amber-950/60 border-amber-800/50",
                desc: "Bright high-visibility yellow crosshair engineered never to blend into bright map backgrounds.",
                command: `cl_crosshair_drawoutline "1"; cl_crosshair_dynamic_maxdist_splitratio "0.3"; cl_crosshair_dynamic_splitalpha_innermod "1"; cl_crosshair_dynamic_splitalpha_outermod "0.45";  alias "nb" "buymenu; play \sounds\ambient\common\animal\horse_4"; cl_crosshair_dynamic_spread_limit "255"; alias "mew" "say meow :3; play \sounds\ambient\common\animal\cat_04"; bind "f" mew;  bind "e" "play \sounds\ambient\canals\music_canals_01"; cl_crosshair_dynamic_splitdist "9"; bind b nb; cl_crosshair_t "0"; cl_crosshairalpha "255"; cl_crosshaircolor_b "255"; play \sounds\vo\hostage\huse\hostage_breath cl_crosshaircolor_g "89"; cl_crosshaircolor_r "255"; cl_crosshairdot "0"; bind "e" play \sounds\ambient\common\energy\tv_static_01; cl_crosshairsize "11"; cl_crosshairstyle "3"; play \sounds\ambient\de_inferno_children; cl_crosshairthickness "1"; cl_crosshair_recoil "0";`
            },
            {
                name: "Compact Booty CRUSHER",
                tag: "EBS69",
                tagColor: "text-purple-400 bg-purple-950/60 border-purple-800/50",
                desc: "Super compact static cross built explicitly for strict tap-shooting and counter-strafing accuracy.",
                command: 'cl_crosshair_drawoutline "1"; cl_crosshair_dynamic_maxdist_splitratio "0.3"; cl_crosshair_dynamic_splitalpha_innermod "1"; cl_crosshair_dynamic_splitalpha_outermod "0.45"; cl_crosshair_dynamic_spread_limit "255"; cl_crosshair_dynamic_splitdist "9"; cl_crosshair_t "0"; cl_crosshairalpha "255"; cl_crosshaircolor_b "255"; cl_crosshaircolor_g "89"; cl_crosshaircolor_r "255"; cl_crosshairdot "0"; cl_crosshairsize "11"; cl_crosshairstyle "3"; cl_crosshairthickness "1"; cl_crosshair_recoil "0";'
            },
            {
                name: "T-Style Red Dot",
                tag: "Special",
                tagColor: "text-rose-400 bg-rose-950/60 border-rose-800/50",
                desc: "Open-top T-style red crosshair offering completely unobstructed view directly above the target.",
                command: "cl_crosshairalpha 255; cl_crosshaircolor 0; cl_crosshairdot 0; cl_crosshairgap -3; cl_crosshairsize 2; cl_crosshairstyle 4; cl_crosshairthickness 1; cl_crosshair_t 1; cl_crosshair_drawoutline 1;"
            },
            {
                name: "Tiny White Box",
                tag: "Minimalist",
                tagColor: "text-slate-300 bg-slate-800/60 border-slate-700/50",
                desc: "Micro white cross designed for pure pixel-hunting and absolute minimalist performance.",
                command: "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairdot 1; cl_crosshairgap -5; cl_crosshairsize 0.5; cl_crosshairstyle 4; cl_crosshairthickness 1.5; cl_crosshair_drawoutline 1;"
            },
            {
                name: "TinyTim",
                tag: "Entry-Fragger",
                tagColor: "text-slate-300 bg-slate-800/60 border-slate-700/50",
                desc: "Micro white cross designed for pure pixel-hunting and absolute minimalist performance.",
                command: "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairdot 1; cl_crosshairgap -5; cl_crosshairsize 0.5; cl_crosshairstyle 4; cl_crosshairthickness 1.5; cl_crosshair_drawoutline 1;"
            },
            {
                name: "Bosnian Beluga",
                tag: "Imposter",
                tagColor: "text-slate-300 bg-slate-800/60 border-slate-700/50",
                desc: "Micro white cross designed for pure pixel-hunting and absolute minimalist performance.",
                command: "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairdot 1; cl_crosshairgap -5; cl_crosshairsize 0.5; cl_crosshairstyle 4; cl_crosshairthickness 1.5; cl_crosshair_drawoutline 1;"
            },
            {
                name: "Funktown Femboys",
                tag: "Hot & Steamy",
                tagColor: "text-slate-300 bg-slate-800/60 border-slate-700/50",
                desc: "Micro white cross designed for pure pixel-hunting and absolute minimalist performance.",
                command: "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairdot 1; cl_crosshairgap -5; cl_crosshairsize 0.5; cl_crosshairstyle 4; cl_crosshairthickness 1.5; cl_crosshair_drawoutline 1;"
            },
            {
                name: "Netanyahu's REVENGE!",
                tag: "Promised 3000 Years Ago",
                tagColor: "text-slate-300 bg-slate-800/60 border-slate-700/50",
                desc: "Micro white cross designed for pure pixel-hunting and absolute minimalist performance.",
                command: "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairdot 1; cl_crosshairgap -5; cl_crosshairsize 0.5; cl_crosshairstyle 4; cl_crosshairthickness 1.5; cl_crosshair_drawoutline 1;"
            },
            {
                name: "Five Freddy's Bear (from fortnite)",
                tag: "Spooky",
                tagColor: "text-slate-300 bg-slate-800/60 border-slate-700/50",
                desc: "Micro white cross designed for pure pixel-hunting and absolute minimalist performance.",
                command: "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairdot 1; cl_crosshairgap -5; cl_crosshairsize 0.5; cl_crosshairstyle 4; cl_crosshairthickness 1.5; cl_crosshair_drawoutline 1;"
            },
            {
                name: "Fortnite Frotting",
                tag: "Paddington Runtime",
                tagColor: "text-slate-300 bg-slate-800/60 border-slate-700/50",
                desc: "Micro white cross designed for pure pixel-hunting and absolute minimalist performance.",
                command: "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairdot 1; cl_crosshairgap -5; cl_crosshairsize 0.5; cl_crosshairstyle 4; cl_crosshairthickness 1.5; cl_crosshair_drawoutline 1;"
            }
        ];

        let currentIndex = 0;

        function updateDisplay() {
            const item = crosshairs[currentIndex];
            document.getElementById('crosshair-name').textContent = item.name;
            document.getElementById('crosshair-desc').textContent = item.desc;
            const tagEl = document.getElementById('crosshair-tag');
            tagEl.textContent = item.tag;
            tagEl.className = `text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-md border ${item.tagColor}`;
            document.getElementById('counter-indicator').textContent = `${currentIndex + 1} / ${crosshairs.length}`;
        }

        function nextCrosshair() {
            currentIndex = (currentIndex + 1) % crosshairs.length;
            updateDisplay();
        }

        function copyCurrentCommand() {
            const item = crosshairs[currentIndex];

            navigator.clipboard.writeText(item.command).then(() => {
                const copyBtn = document.getElementById('copy-btn');
                const originalHTML = copyBtn.innerHTML;

                copyBtn.innerHTML = `
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                    <span>Copied to Clipboard!</span>
                `;
                copyBtn.classList.remove('bg-accent', 'hover:bg-accentHover');
                copyBtn.classList.add('bg-emerald-600');

                const toast = document.getElementById('toast');
                toast.classList.remove('translate-y-24', 'opacity-0');

                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                    copyBtn.classList.remove('bg-emerald-600');
                    copyBtn.classList.add('bg-accent', 'hover:bg-accentHover');
                    toast.classList.add('translate-y-24', 'opacity-0');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>
</body>
</html>
