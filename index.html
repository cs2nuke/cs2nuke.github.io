<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Discord...</title>
    <!-- HTML Meta Refresh Fallback (instant) -->
    <meta http-equiv="refresh" content="0; url=https://discord.gg/8BRKBmdFkU">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons for Discord branding -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        discord: {
                            brand: '#5865F2',
                            hover: '#4752C4',
                            green: '#57F287',
                            bg: '#1E1F22',
                            card: '#2B2D31',
                            muted: '#949BA4'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        .glow-discord {
            box-shadow: 0 0 35px rgba(88, 101, 242, 0.25);
        }
    </style>

    <script>
        // Execute instant JavaScript redirect
        const TARGET_URL = 'https://discord.gg/8BRKBmdFkU';
        window.location.href = TARGET_URL;
    </script>
</head>
<body class="bg-discord-bg text-white font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-discord-card rounded-2xl border border-slate-700/50 p-8 text-center shadow-2xl glow-discord relative overflow-hidden">
        
        <!-- Decorative Ambient Background Glow -->
        <div class="absolute -top-16 -left-16 w-32 h-32 bg-discord-brand/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -right-16 w-32 h-32 bg-discord-brand/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Discord Logo Icon -->
        <div class="relative z-10 mb-6">
            <div class="w-20 h-20 mx-auto rounded-2xl bg-discord-brand/10 border border-discord-brand/30 flex items-center justify-center text-discord-brand text-4xl shadow-lg animate-pulse">
                <i class="fa-brands fa-discord"></i>
            </div>
        </div>

        <!-- Headline & Redirection Status -->
        <div class="relative z-10 space-y-2 mb-8">
            <h1 class="text-2xl font-extrabold tracking-tight text-white">Redirecting to Discord</h1>
            <p class="text-discord-muted text-sm flex items-center justify-center gap-2 font-medium">
                <span class="w-2 h-2 rounded-full bg-discord-green animate-ping"></span>
                Connecting you to the community...
            </p>
        </div>

        <!-- Manual Redirect Fallback Button -->
        <div class="relative z-10 space-y-4">
            <a href="https://discord.gg/8BRKBmdFkU" class="w-full py-3.5 px-6 rounded-xl bg-discord-brand hover:bg-discord-hover text-white font-bold transition-all flex items-center justify-center space-x-2 shadow-lg shadow-discord-brand/20 group">
                <span>Join Discord Server</span>
                <i class="fa-solid fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
            </a>

            <p class="text-xs text-discord-muted">
                If you are not redirected automatically within a few seconds, click the button above.
            </p>
        </div>
    </main>

</body>
</html>
